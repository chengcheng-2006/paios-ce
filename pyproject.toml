[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paios-ce"
version = "0.1.0.dev0"
description = "PAIOS CE clean-room public core scaffold - local pre-release candidate"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Cheng Cheng" }]
keywords = ["paios", "clean-room", "ai-agent", "permission-engine", "secretref"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "coverage>=7,<8",
    "pytest-cov>=5,<8",
]

[project.scripts]
paios-ce = "paios_ce.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
filterwarnings = [
    # The `schema` field is contract-required by the Phase 2 config schema and
    # intentionally shadows BaseModel.schema(); the warning is benign.
    "ignore:Field name \"schema\" in .* shadows an attribute:UserWarning",
]
