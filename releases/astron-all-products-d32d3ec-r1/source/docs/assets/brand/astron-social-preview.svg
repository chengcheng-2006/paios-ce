<?xml version="1.0" encoding="UTF-8"?>
<!--
  Astron — Social Preview (1280 x 640)
  Derived from the public PAIOS CE baseline layout during AIC 2026 Phase 0.
  Typography-only with a light geometric gate motif. No logo, no illustration.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Astron</title>
  <desc id="desc">The model proposes. The runtime decides. Recoverable and verifiable execution control for AI agents.</desc>
  <defs>
    <marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/></marker>
    <marker id="g-arrow-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker>
  </defs>
  <rect x="0" y="0" width="1280" height="640" fill="#ffffff"/>
  <g stroke="#eaeef2" stroke-width="1"><line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="480" x2="1280" y2="480"/></g>
  <text x="72" y="212" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="64" font-weight="800" letter-spacing="1" fill="#1f2328">Astron</text>
  <text x="72" y="300" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="30" font-weight="600" fill="#0969da">The model proposes. The runtime decides.</text>
  <text x="72" y="376" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="22" font-weight="400" fill="#57606a">Recoverable, verifiable execution control</text>
  <text x="72" y="406" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="22" font-weight="400" fill="#57606a">for AI agents</text>
  <circle cx="796" cy="330" r="10" fill="#d0d7de"/><line x1="812" y1="330" x2="866" y2="330" stroke="#6e7681" stroke-width="2" marker-end="url(#g-arrow)"/>
  <g><rect x="870" y="262" width="14" height="136" rx="7" fill="#1f2328"/><rect x="896" y="262" width="6" height="136" rx="3" fill="#d0d7de"/><text x="884" y="238" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="600" fill="#57606a">GATE</text></g>
  <line x1="906" y1="330" x2="972" y2="330" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#g-arrow-pass)"/>
  <g><rect x="976" y="292" width="160" height="76" rx="12" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><circle cx="1000" cy="330" r="6" fill="#1a7f37"/><text x="1016" y="326" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="16" font-weight="700" fill="#1f2328">accepted result</text><text x="1016" y="348" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12" fill="#57606a">scoped and auditable</text></g>
  <path d="M 870 420 L 882 420 L 882 470 L 1050 470" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g-arrow)"/><text x="892" y="462" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12.5" font-weight="600" fill="#cf222e">or stop</text>
  <line x1="72" y1="520" x2="1208" y2="520" stroke="#eaeef2" stroke-width="1.5"/><text x="72" y="560" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="15" fill="#8c959f">Local-first · deterministic · deny-by-default · redacted audit</text>
</svg>
