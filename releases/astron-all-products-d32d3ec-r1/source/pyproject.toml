[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "astron"
version = "0.1.0rc2"
description = "Astron: an open-source recoverable and verifiable execution-control runtime for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Cheng Cheng" }]
keywords = ["astron", "ai-agent", "execution-control", "permission-engine", "secretref"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "jsonschema>=4.20,<5",
    # Phase 3's fixed, trusted test tool invokes `python -m pytest`; this is
    # a runtime dependency of that narrowly admitted feature, not an arbitrary
    # model-controlled command dependency.
    "pytest>=9.0.3,<10",
]

[project.optional-dependencies]
dev = [
    "coverage>=7,<8",
    "pytest-cov>=5,<8",
]
# Local ASR: optional local speech-to-text. Kept out of the base install so the
# base package and all existing CLI commands work without it. Verified range:
# faster-whisper 1.2.1 (current upstream) ships Python 3.11/3.12 wheels and
# supports WhisperModel(..., local_files_only=True), device cpu/cuda/auto,
# compute_type int8, vad_filter and word_timestamps. ctranslate2/PyAV are pulled
# in as transitive dependencies of faster-whisper.
speech = [
    "faster-whisper>=1.1.0,<1.3",
]

[project.scripts]
astron = "paios_ce.cli.main:main"
# Legacy compatibility alias. Astron is the primary competition CLI.
paios-ce = "paios_ce.cli.main:main"

[project.urls]
Homepage = "https://github.com/chengcheng-2006/paios-ce"
Repository = "https://github.com/chengcheng-2006/paios-ce"
Issues = "https://github.com/chengcheng-2006/paios-ce/issues"
Documentation = "https://github.com/chengcheng-2006/paios-ce/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"paios_ce.agent.fixtures" = [
    "aic2026_repo_maintenance/README.md",
    "aic2026_repo_maintenance/maintenance_config.py",
    "aic2026_repo_maintenance/tests/test_maintenance_config.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
filterwarnings = [
    # The `schema` field is contract-required by the public config schema and
    # intentionally shadows BaseModel.schema(); the warning is benign.
    "ignore:Field name \"schema\" in .* shadows an attribute:UserWarning",
]
