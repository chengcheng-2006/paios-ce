<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
  <title id="title">Astron 执行治理运行时</title>
  <desc id="desc">模型提出动作，运行时按权限裁决，受限工具执行并记录，验收器确认最终结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#6558d3"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7b8aa0"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#1b3b67" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1280" height="590" rx="30" fill="url(#bg)"/>
  <circle cx="1130" cy="92" r="170" fill="#dbeafe" opacity=".46"/>
  <circle cx="1140" cy="470" r="220" fill="#e7e5ff" opacity=".50"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="76" y="70" width="126" height="38" rx="19" fill="#e1ebff"/>
    <text x="139" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#2454ab">AI Agent 执行控制</text>
    <text x="76" y="188" font-size="64" font-weight="800" fill="#10233f">Astron</text>
    <text x="76" y="244" font-size="28" font-weight="700" fill="#2454ab">面向 AI Agent 的执行治理运行时</text>
    <text x="76" y="292" font-size="20" fill="#52637c">模型提出动作 · 运行时按策略裁决 · 验证器确认完成</text>
    <g filter="url(#shadow)">
      <rect x="76" y="356" width="240" height="118" rx="18" fill="#fff"/>
      <rect x="344" y="356" width="260" height="118" rx="18" fill="#fff"/>
      <rect x="632" y="356" width="260" height="118" rx="18" fill="#fff"/>
      <rect x="920" y="356" width="284" height="118" rx="18" fill="#fff"/>
    </g>
    <text x="104" y="396" font-size="14" font-weight="700" fill="#6b7c95">01 · 提议</text>
    <text x="104" y="438" font-size="22" font-weight="700" fill="#152944">Agent 提出动作</text>
    <text x="372" y="396" font-size="14" font-weight="700" fill="#315cc5">02 · 授权</text>
    <text x="372" y="438" font-size="22" font-weight="700" fill="#152944">运行时作出裁决</text>
    <text x="660" y="396" font-size="14" font-weight="700" fill="#6558d3">03 · 执行与记录</text>
    <text x="660" y="438" font-size="22" font-weight="700" fill="#152944">状态持久、过程可查</text>
    <text x="948" y="396" font-size="14" font-weight="700" fill="#18804a">04 · 验收</text>
    <text x="948" y="438" font-size="22" font-weight="700" fill="#152944">验收器确认结果</text>
    <path d="M320 415h17M608 415h17M896 415h17" fill="none" stroke="#7b8aa0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="76" y="510" width="1128" height="2" rx="1" fill="url(#accent)" opacity=".38"/>
    <text x="76" y="548" font-size="15" fill="#66758b">默认拒绝 · 持久动作日志 · 异常核对 · 验证后完成</text>
    <text x="1204" y="548" text-anchor="end" font-size="14" fill="#8795a8">本地优先 · Apache-2.0</text>
  </g>
</svg>
