name: Bug Report
description: Report a bug in PAIOS CE
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
        
        **Security Notice:** DO NOT paste real API keys, tokens, passwords, or production data.
        Use placeholders like `sk-EXAMPLE`, `your-token-here`, or `example.invalid` instead.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
      placeholder: "When I run `paios-ce demo`, I see..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `paios-ce demo`
        2. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: The Python version you are using.
      placeholder: "3.11.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Your operating system.
      placeholder: "Windows 11 / Ubuntu 22.04 / macOS 14"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: |
        Paste any relevant log output. DO NOT include real secrets or production data.
        
        **Important:** Redact any sensitive information before pasting.
      render: shell

  - type: checkboxes
    id: security
    attributes:
      label: Security Confirmation
      options:
        - label: I have not included any real API keys, tokens, passwords, or production data
          required: true