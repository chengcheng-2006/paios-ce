name: Feature Request
description: Request a new feature for PAIOS CE
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the sections below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: "I would like to be able to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the feature request.

  - type: checkboxes
    id: alignment
    attributes:
      label: Alignment Check
      options:
        - label: This feature aligns with PAIOS CE's clean-room boundary (no production integrations)
          required: true
        - label: This feature respects the security-first, privacy-first philosophy
          required: true